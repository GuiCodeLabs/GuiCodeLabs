name: Generate activity graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate activity-graph.svg
        run: |
          mkdir -p dist
          curl --fail --silent --show-error --location \
            "https://github-readme-activity-graph.vercel.app/graph?username=GuiCodeLabs&radius=16&theme=dracula&area=true" \
            --output dist/activity-graph.svg
          test -s dist/activity-graph.svg
          grep -q "<svg" dist/activity-graph.svg

      - name: push activity-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: activity-graph-output
          build_dir: dist
          author: "Guilherme Beserra <173941502+GuiCodeLabs@users.noreply.github.com>"
          committer: "Guilherme Beserra <173941502+GuiCodeLabs@users.noreply.github.com>"
          commit_message: "chore(activity): atualiza gráfico de atividade"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}