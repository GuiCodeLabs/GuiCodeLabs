name: Generate stats card

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate stats.svg
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&locale=en&hide_title=false&hide_rank=false&show_icons=true&include_all_commits=true&count_private=true&disable_animations=false&theme=dracula&hide_border=false&order=1
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: push stats.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist
          author: "Guilherme Beserra <173941502+GuiCodeLabs@users.noreply.github.com>"
          committer: "Guilherme Beserra <173941502+GuiCodeLabs@users.noreply.github.com>"
          commit_message: "chore(stats): atualiza cartão de estatísticas"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}