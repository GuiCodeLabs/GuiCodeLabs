name: Atualizar estatísticas do perfil

on:
  schedule:
    - cron: "31 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-stats.yml

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'GuiCodeLabs/GuiCodeLabs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PROFILE_STATS_ENABLED: ${{ secrets.PROFILE_STATS_TOKEN != '' }}

    steps:
      - name: Aguardar o secret do perfil
        if: env.PROFILE_STATS_ENABLED != 'true'
        run: echo 'Configure o secret PROFILE_STATS_TOKEN e execute este workflow para ativar os cartões.'

      - name: Baixar o repositório
        if: env.PROFILE_STATS_ENABLED == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # O token fica apenas nos inputs da acao, nunca no README ou nos SVGs.
      - name: Gerar estatísticas de todo o período
        if: env.PROFILE_STATS_ENABLED == 'true'
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=GuiCodeLabs&show_icons=true&include_all_commits=true&theme=tokyonight&hide_border=true&locale=pt-br
          path: profile/stats.svg
          core_version: 2.2.0
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: true

      - name: Gerar commits deste ano
        if: env.PROFILE_STATS_ENABLED == 'true'
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=GuiCodeLabs&show_icons=true&hide=stars,prs,issues,contribs&hide_rank=true&custom_title=Commits%20neste%20ano&card_width=360&theme=tokyonight&hide_border=true&locale=pt-br
          path: profile/commits-year.svg
          core_version: 2.2.0
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: true

      - name: Vincular os cartões no README após a geração
        if: env.PROFILE_STATS_ENABLED == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          original = readme.read_text(encoding="utf-8")
          replacements = {
              "https://github-readme-stats.vercel.app/api?username=GuiCodeLabs&amp;show_icons=true&amp;include_all_commits=true&amp;theme=tokyonight&amp;hide_border=true&amp;locale=pt-br": "./profile/stats.svg",
              "https://github-readme-stats.vercel.app/api?username=GuiCodeLabs&amp;show_icons=true&amp;hide=stars,prs,issues,contribs&amp;hide_rank=true&amp;custom_title=Commits%20neste%20ano&amp;card_width=360&amp;theme=tokyonight&amp;hide_border=true&amp;locale=pt-br": "./profile/commits-year.svg",
              "Estatísticas públicas de Guilherme no GitHub": "Estatísticas de Guilherme no GitHub",
              "Quantidade de commits públicos de Guilherme no ano atual": "Quantidade de commits de Guilherme no ano atual",
          }
          updated = original
          for old, new in replacements.items():
              updated = updated.replace(old, new)
          if updated != original:
              readme.write_text(updated, encoding="utf-8")
          PY

      - name: Publicar cartões gerados
        if: env.PROFILE_STATS_ENABLED == 'true'
        shell: bash
        run: |
          git add -- profile/stats.svg profile/commits-year.svg README.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Atualiza estatísticas do perfil'
            git push origin HEAD:main
          fi
