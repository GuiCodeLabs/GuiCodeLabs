name: Atualizar gráfico Pac-Man

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Gerar SVGs das contribuições
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: GuiCodeLabs
          games: pacman

      - name: Publicar SVGs na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
